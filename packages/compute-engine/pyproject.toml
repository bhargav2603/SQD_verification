[project]
name = "qdr-compute-engine"
version = "0.1.0"
description = "QDR compute engine: the 9-stage FMO -> VQE pipeline and the SolverBackend driver seam."
requires-python = ">=3.12"

dependencies = [
    "qdr-core",
    "numpy>=1.26",
    "scipy>=1.12",
    "openfermion>=1.8",
]

# PySCF publishes no Windows wheels (manylinux + macOS only). Keeping it in an optional
# extra *and* marking it off-win32 lets `uv sync` succeed on a Windows dev box; the
# PySCF-dependent tests then auto-skip locally and run for real on Linux CI.
[project.optional-dependencies]
chem = ["pyscf>=2.6; sys_platform != 'win32'", "matplotlib>=3.8"]

[tool.uv.sources]
qdr-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdr_compute_engine"]
